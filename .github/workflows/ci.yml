name: CI

# Runs the extension, worker and tokenbrake test suites and the build on every push to
# main and every pull request. The build step also enforces that the system
# prompt is byte-identical across extension/background.js and worker/src/index.js
# (build.mjs fails on drift), so a prompt change that lands in only one copy
# can never reach main.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install: the tests use a sandboxed fake `chrome` and
      # fake `fetch`, and the build has no third-party imports — no `npm ci`
      # step needed. Each step below calls the matching script in
      # package.json, kept as separate steps (rather than one `npm test`) so
      # a failure names its suite directly in the GitHub UI.
      - name: Extension tests
        run: npm run test:extension

      - name: Worker tests
        run: npm run test:worker

      - name: tokenbrake tests
        run: npm run test:tokenbrake

      - name: Build (verifies prompt byte-identity)
        run: npm run build

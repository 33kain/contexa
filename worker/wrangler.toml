name = "contexa-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Quota counters. Create the namespace once, then paste its id below:
#   npx wrangler kv namespace create CX_KV
[[kv_namespaces]]
binding = "CX_KV"
id = "68d9d130c21741e8a5450f38f2942df7"

[vars]
# Model used for suggestions. Sonnet 5 on measured evidence: it obeys the label,
# bullet and voice rules that Haiku ignores. Per-call cost is derived in
# README.md ("What it costs you") and not restated here — the figure that used to
# sit on this line was Haiku-era AND pre-pivot, and went stale twice over
# because it was a second copy of a number that has one home.
MODEL = "claude-sonnet-5"

# Lock the API to your published extension so nobody else can spend your quota.
# Leave empty during development (any chrome-extension:// origin is accepted),
# then set it to your real extension ID before you launch:
#   npx wrangler deploy --var ALLOWED_EXTENSION_IDS:abcdefghijklmnopabcdefghijklmnop
ALLOWED_EXTENSION_IDS = "phhamigkjeeabbjncpmhkppkjccfglhb"

# Secrets are NOT set here. Set them once, interactively:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put IP_SALT
